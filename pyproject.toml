[project]
name = "bulk-rnaseq-dea-python"
version = "0.1.0"
description = "Differential expression analysis of bulk RNA-seq data using PyDESeq2"
requires-python = ">=3.11"
dependencies = [
    "pydeseq2>=0.5.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scanpy>=1.9.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "requests>=2.31.0",
]

[tool.uv]

[dependency-groups]
dev = []
